<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a1a1a" />
    <title>Sem conexão — Markup Incorporações</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 32px;
        background: #1a1a1a;
        color: #f5ebe1;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 24px;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        margin: 0;
      }
      p {
        font-size: 15px;
        line-height: 1.6;
        color: rgba(245, 235, 225, 0.7);
        max-width: 340px;
        margin: 0;
      }
      button {
        margin-top: 8px;
        padding: 12px 28px;
        border: none;
        border-radius: 999px;
        background: #b8945f;
        color: #1a1a1a;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="Markup Incorporações" />
    <h1>Você está sem conexão</h1>
    <p>
      Não foi possível carregar esta página. Verifique sua internet e tente
      novamente.
    </p>
    <button onclick="location.reload()">Tentar novamente</button>
  </body>
</html>
